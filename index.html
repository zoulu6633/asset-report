<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南京资产租赁信息汇总 · 最新报告</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#f8f4ec,#f2ecdf);font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#3d2817}
.card{text-align:center;padding:34px 40px;background:rgba(255,255,255,.6);border-radius:18px;
  box-shadow:0 14px 44px rgba(120,90,40,.14),inset 0 1px 0 rgba(255,255,255,.9)}
h1{font-size:19px;margin:0 0 10px;font-weight:600}
p{font-size:13px;color:#6b4423;margin:6px 0}
.spin{display:inline-block;width:26px;height:26px;border:3px solid rgba(169,126,47,.25);
  border-top-color:#a97e2f;border-radius:50%;animation:spin 1s linear infinite;margin:16px 0 4px}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:#1a6fb5;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>南京资产租赁信息汇总</h1>
  <div class="spin"></div>
  <p>正在载入最新一期报告…</p>
  <p id="fallback"></p>
</div>
<script>
(function(){
  function go(d){
    var dst='archive/'+d+'/index.html';
    try{location.replace(dst)}catch(e){location.href=dst}
  }
  fetch('latest_date.txt').then(function(r){return r.text()})
    .then(function(t){go(t.trim())})
    .catch(function(){var f=document.getElementById('fallback');
      f.innerHTML='<a href="archive/">进入历史报告索引</a>'});
})();
</script>
</body>
</html>
